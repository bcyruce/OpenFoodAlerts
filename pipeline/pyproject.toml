[project]
name = "openfoodalerts"
version = "0.1.0"
description = "OpenFoodAlerts ingestion pipeline, classifier and eval harness"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "tenacity>=9.0",
    "pydantic>=2.8",
    "psycopg[binary]>=3.2",
    "selectolax>=0.3.21",
]

[project.scripts]
ofa = "openfoodalerts.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openfoodalerts"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Chinese email strings (mail/messages.py) use full-width punctuation on purpose.
allowed-confusables = ["（", "）", "：", "，", "。", "；"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=openfoodalerts --cov-report=term-missing --cov-fail-under=80"
markers = [
    "db: needs a live Postgres reachable through TEST_DATABASE_URL",
]

[tool.coverage.run]
branch = true
source = ["openfoodalerts"]
