services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ofa
      POSTGRES_PASSWORD: ofa
      POSTGRES_DB: ofa
    ports:
      - "${OFA_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ofa -d ofa"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
