# OpenFoodAlerts reverse proxy (ticket 34). Debian/Ubuntu layout:
#   /etc/nginx/sites-available/openfoodalerts.conf  (this file; symlink it into sites-enabled/)
#   /etc/nginx/snippets/openfoodalerts-headers.conf (security headers)
#   /etc/nginx/snippets/openfoodalerts-proxy.conf   (headers sent to Next.js)
# Certificates: certbot certonly --webroot -w /var/www/letsencrypt (docs/runbook.md), so
# certbot never edits this file. Remove sites-enabled/default: the catch-all servers below
# replace it and log with the masked format too.
#
# Written for nginx 1.22+ (Debian 12; Ubuntu 24.04 has 1.24). On 1.25.1+ `listen ... http2`
# still works but logs a deprecation notice; replace it with `http2 on;` there.

# --- http context -----------------------------------------------------------------------

# Access logs must not keep manage/unsubscribe tokens (implementation-log ### 29, ROPA §2.3):
# they are in the path (/{locale}/alerts/manage/<token>) and in the query (?token=...).
# Two chained maps rewrite the request line; the same is done for the Referer header.
map $request $ofa_request_masked_path {
    default $request;
    "~^(?<ofa_mp_a>.*/alerts/manage/)[^/? ]+(?<ofa_mp_b>.*)$" "${ofa_mp_a}[masked]${ofa_mp_b}";
}
map $ofa_request_masked_path $ofa_request_masked {
    default $ofa_request_masked_path;
    "~^(?<ofa_mq_a>.*[?&]token=)[^& ]*(?<ofa_mq_b>.*)$" "${ofa_mq_a}[masked]${ofa_mq_b}";
}
map $http_referer $ofa_referer_masked_path {
    default $http_referer;
    "~^(?<ofa_rp_a>.*/alerts/manage/)[^/?#]+(?<ofa_rp_b>.*)$" "${ofa_rp_a}[masked]${ofa_rp_b}";
}
map $ofa_referer_masked_path $ofa_referer_masked {
    default $ofa_referer_masked_path;
    "~^(?<ofa_rq_a>.*[?&]token=)[^&#]*(?<ofa_rq_b>.*)$" "${ofa_rq_a}[masked]${ofa_rq_b}";
}

# Data minimisation: log IPv4 addresses without the last octet and IPv6 addresses with only
# the first 48 bits (enough to spot abuse from a network, not to identify a visitor). The
# rate limit below still uses the full address, in memory only.
map $remote_addr $ofa_remote_addr_masked {
    "~^(?<ofa_ip4>\d+\.\d+\.\d+)\.\d+$" "${ofa_ip4}.0";
    "~^(?<ofa_ip6>[0-9a-fA-F]*:[0-9a-fA-F]*:[0-9a-fA-F]*):" "${ofa_ip6}::";
    default "-";
}

log_format ofa_masked '$ofa_remote_addr_masked - [$time_local] "$ofa_request_masked" '
                      '$status $body_bytes_sent "$ofa_referer_masked" "$http_user_agent" '
                      'rt=$request_time host=$host';

# Defence in depth for /api/ (the app has its own per-IP limits for the subscription routes).
limit_req_zone $binary_remote_addr zone=ofa_api:10m rate=10r/s;
limit_req_status 429;

# Keep the app's own Referrer-Policy (no-referrer on token pages); add ours only when the
# app did not send one. An empty value means add_header sends nothing.
map $upstream_http_referrer_policy $ofa_referrer_policy {
    "" "strict-origin-when-cross-origin";
    default "";
}

upstream ofa_web {
    server 127.0.0.1:3000;
    keepalive 16;
}

# --- catch-all servers: unknown Host headers and bare-IP requests -------------------------

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log /var/log/nginx/openfoodalerts.access.log ofa_masked;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 444; }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    ssl_reject_handshake on;
    access_log /var/log/nginx/openfoodalerts.access.log ofa_masked;
}

# --- HTTP -> HTTPS -------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name openfoodalerts.nl www.openfoodalerts.nl;
    access_log /var/log/nginx/openfoodalerts.access.log ofa_masked;

    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://openfoodalerts.nl$request_uri; }
}

# --- www -> apex ---------------------------------------------------------------------------

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.openfoodalerts.nl;
    access_log /var/log/nginx/openfoodalerts.access.log ofa_masked;

    ssl_certificate     /etc/letsencrypt/live/openfoodalerts.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openfoodalerts.nl/privkey.pem;
    include snippets/openfoodalerts-tls.conf;

    return 301 https://openfoodalerts.nl$request_uri;
}

# --- the site ------------------------------------------------------------------------------

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name openfoodalerts.nl;

    access_log /var/log/nginx/openfoodalerts.access.log ofa_masked;
    # The error log cannot use a custom format and may quote a request line (with a token)
    # when the upstream fails. Keep it at "error" and rotate it quickly (runbook "Logs").
    error_log /var/log/nginx/openfoodalerts.error.log error;

    ssl_certificate     /etc/letsencrypt/live/openfoodalerts.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openfoodalerts.nl/privkey.pem;
    include snippets/openfoodalerts-tls.conf;

    server_tokens off;
    # The API takes small JSON bodies only.
    client_max_body_size 64k;

    # Compression is done here, not by Next (Accept-Encoding is not forwarded upstream).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/xml application/javascript
               application/json application/manifest+json image/svg+xml text/x-component;

    include snippets/openfoodalerts-headers.conf;

    # Hashed build assets never change: cache for a year.
    location /_next/static/ {
        include snippets/openfoodalerts-proxy.conf;
        proxy_pass http://ofa_web;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include snippets/openfoodalerts-headers.conf;
    }

    # RFC 8058 one-click unsubscribe comes from a few mail-provider IPs acting for many
    # subscribers; the app deliberately does not rate-limit it (implementation-log ### 29).
    location = /api/unsubscribe {
        include snippets/openfoodalerts-proxy.conf;
        proxy_pass http://ofa_web;
    }

    location /api/ {
        limit_req zone=ofa_api burst=20 nodelay;
        include snippets/openfoodalerts-proxy.conf;
        proxy_pass http://ofa_web;
    }

    location / {
        include snippets/openfoodalerts-proxy.conf;
        proxy_pass http://ofa_web;
    }
}

