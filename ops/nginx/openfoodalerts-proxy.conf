# /etc/nginx/snippets/openfoodalerts-proxy.conf (ticket 34)
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# The app takes the client IP from these headers (CLIENT_IP_HEADER, implementation-log
# ### 28). Both are OVERWRITTEN with the connecting address, never appended to, so a client
# cannot smuggle in a fake address. If a CDN is ever put in front, this must change.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
# nginx compresses (see gzip in the site config); Next should not.
proxy_set_header Accept-Encoding "";
proxy_read_timeout 60s;
proxy_hide_header X-Powered-By;
