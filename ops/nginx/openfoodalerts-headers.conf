# /etc/nginx/snippets/openfoodalerts-headers.conf (ticket 34)
# Included at server level and again in every location that has its own add_header
# (nginx drops inherited add_header directives as soon as a location defines one).

# HSTS for one year. Add "; includeSubDomains; preload" only after deciding on preloading
# (owner decision, docs/deploy-proposal.md): it is hard to undo.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy $ofa_referrer_policy always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Content Security Policy, report-only for now: Next.js inlines its bootstrap scripts, so
# 'unsafe-inline' is needed until the app uses nonces. Check the browser console on every
# page type, then rename the header to Content-Security-Policy. Self-hosted Umami needs
# its origin added to script-src and connect-src.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
